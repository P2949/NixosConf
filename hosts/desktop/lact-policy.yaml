      interval_ms: 500
      curve:
        30: 0.2
        40: 0.3
        45: 0.5
        50: 0.7
        55: 1.0
      spindown_delay_ms: 5000
      change_threshold: 2
    pmfw_options:
      zero_rpm: true
    performance_level: auto
