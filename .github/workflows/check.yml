name: Nix checks

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Flake checks
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Provide memory headroom for NixOS image checks
        run: |
          sudo fallocate -l 12G /mnt/nix-checks.swap
          sudo chmod 600 /mnt/nix-checks.swap
          sudo mkswap /mnt/nix-checks.swap
          sudo swapon /mnt/nix-checks.swap
          free -h
          df -h / /mnt

      - name: Run flake checks
        run: nix flake check --no-write-lock-file --print-build-logs --max-jobs 1 --cores 2

      - name: Build desktop system
        run: nix build .#nixosConfigurations.desktop.config.system.build.toplevel --no-link --no-write-lock-file --print-build-logs --max-jobs 1 --cores 2
